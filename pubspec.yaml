name: json_info_viewer
description: Local JSON Information Viewer - Flutter Asset Management Activity by Nathaniel S. Coronado (3BSIT-1)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Register the local JSON file and images so Flutter bundles them with the app
  assets:
    - assets/data/languages.json
    - assets/images/
